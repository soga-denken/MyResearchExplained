title: My Research Explained
version: 0.1.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    html:
      theme:
        light: [cosmo, mre-light.scss]
        dark: [cosmo, mre-dark.scss]
      css: mre.css
      template-partials:
        - title-metadata.html
      filters:
        - mre.lua
      toc: true
      toc-depth: 2
      toc-title: "On this page"
      code-copy: true
      link-external-newwindow: true
      canonical-url: true
      date-format: iso          # keeps dates machine-readable (also used in JSON-LD)
      respect-user-color-scheme: false   # always open on the white theme; the navbar toggle still offers dark
      grid:
        sidebar-width: 290px
        body-width: 752px       # floating column = this - 3em = 704px, matching --mre-wide (44rem) in mre.css
